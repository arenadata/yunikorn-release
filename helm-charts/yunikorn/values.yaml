# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

imagePullSecrets: []
serviceAccount: yunikorn-admin
hostNetwork: false

priorityClassName: ""

image:
  # Container registry for this image; leave empty to pull the repository
  # unqualified (Docker Hub by default).
  registry: ""
  repository: apache/yunikorn
  tag: scheduler-latest
  pullPolicy: Always

nodeSelector: {}
tolerations: []
affinity: {}

admissionController:
  priorityClassName: ""
  image:
    registry: ""
    repository: apache/yunikorn
    tag: admission-latest
    pullPolicy: Always
  replicaCount: 1
  serviceAccount: yunikorn-admission-controller
  hostNetwork: true
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 500Mi
  goMemoryLimitPercentage: 60
  goGC: 100
  # Extra environment variables for the admission controller container, appended after the
  # chart's own. A duplicate name overrides the chart's value.
  envs: []
  # Extra volume mounts for the admission controller container and extra volumes for its
  # pod spec. Both are appended to the webhook secret volume the chart mounts itself, whose
  # name "admission-controller-secrets" is reserved: reusing it renders and lints cleanly,
  # but the API server rejects it as a duplicate volume name.
  extraVolumeMounts: []
  extraVolumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
  podLabels: {}
  podAnnotations: {}

web:
  image:
    registry: ""
    repository: apache/yunikorn
    tag: web-latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 500Mi
  goMemoryLimitPercentage: 60
  goGC: 100
  # Extra environment variables for the web container, appended after the chart's own.
  # A duplicate name overrides the chart's value, as with the scheduler envs below.
  envs: []
  #  - name: YUNIKORN_K8SHIM_URL
  #    value: unix:///var/run/yunikorn/k8shim.sock
  # Extra volume mounts for the web container. The volumes themselves must be declared
  # in extraVolumes (below), which is shared by all containers in the pod.
  extraVolumeMounts: []
  #  - name: k8shim-socket
  #    mountPath: /var/run/yunikorn

service:
  type: ClusterIP
  port: 9080
  portWeb: 9889

# Extra environment variables for the scheduler container, appended after the chart's own.
# A duplicate name overrides the chart's value, because the runtime keeps the last entry -
# prefer the dedicated goGC / goMemoryLimitPercentage knobs over shadowing GOGC/GOMEMLIMIT.
envs: []
#  - name: HTTP_PROXY
#    value: "http://proxy.example.com:3128"
#  - name: MY_SECRET
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: token
#  # REST API on a unix socket shared with the web container, see the chart README
#  - name: YUNIKORN_K8SHIM_SOCKET_PATH
#    value: /var/run/yunikorn/k8shim.sock

# Extra volumes and volume mounts for the scheduler container. Use these to mount, for
# example, TLS certs for the metrics endpoint when service.metricsTlsEnabled is set in
# yunikornDefaults (below). extraVolumeMounts is applied to the scheduler container
# (see web.extraVolumeMounts above for the web container); extraVolumes is added to the
# pod spec and is shared by all containers. All default to empty (nothing is mounted).
extraVolumeMounts: []
#  - name: metrics-tls
#    mountPath: /etc/yunikorn/tls
#    readOnly: true
#  - name: k8shim-socket
#    mountPath: /var/run/yunikorn
extraVolumes: []
#  - name: metrics-tls
#    secret:
#      secretName: yunikorn-metrics-tls   # keys: tls.crt / tls.key
#      defaultMode: 0440
#  # carries the k8shim REST API socket between the scheduler and web containers;
#  # both need it in their extraVolumeMounts
#  - name: k8shim-socket
#    emptyDir: {}

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 2Gi

# Percentage of the real memory limit of the container to which the GOMEMLIMIT variable is set
# GOMEMLIMIT variable sets a soft memory limit for the runtime to use in GC runs.
goMemoryLimitPercentage: 80

# Go garbage-collection threshold (GOGC) as a percentage of freshly allocated data to
# live data remaining after the previous GC.
goGC: 100

# Bootstrap configuration for YuniKorn - will be rendered into yunikorn-defaults ConfigMap.
# Any valid options for YuniKorn may be specified here.
# Example:
# yunikornDefaults:
#   service.placeholderImage: registry.k8s.io/pause:3.7
#   service.placeholderRunAsUser: 65534
#   service.placeholderRunAsGroup: 65534
#   service.placeholderFsGroup: 65534
#   # Metrics endpoint TLS (mount the cert/key via service.metricsTls.secretName above):
#   service.metricsTlsEnabled: "true"
#   service.metricsTlsCertFile: "/etc/yunikorn/tls/tls.crt"
#   service.metricsTlsKeyFile: "/etc/yunikorn/tls/tls.key"
#   # Publish only /metrics on :9080, serving the REST API on a unix socket instead.
#   # Needs the socket volume and both env vars above, and a restart. See the README.
#   service.exposeMetricsOnly: "true"
#   admissionController.filtering.processNamespaces: "example"
#   admissionController.filtering.bypassNamespaces: "kube-system"
#   admissionController.filtering.labelNamespaces
#   admissionController.filtering.noLabelNamespaces
yunikornDefaults: {}

# When this flag is true, the admission controller will be installed along with the scheduler.
# When this flag is false, the admission controller will not be installed.
# Once the admission controller is installed, all traffic will be routing to yunikorn.
embedAdmissionController: true

# When this flag is true, the web service will be deployed.
# When this flag is false, the web service will not be deployed.
enableWebService: true

podLabels: {}
podAnnotations: {}
podSecurityContext: {}
schedulerSecurityContext: {}
webSecurityContext: {}
admissionPodSecurityContext: {}
admissionContainerSecurityContext: {}
